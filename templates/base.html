<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" >
    <title>{% block title %}{% endblock %}</title>
    <style>
        body {
            font-family: 'custom', -apple-system, sans-serif;
            margin: 0;
            height: 100vh;
            background: linear-gradient(-45deg,rgb(247, 223, 215),rgb(247, 209, 190),rgb(246, 240, 209),rgb(233, 221, 198),rgb(205, 198, 194));
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }
    
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .nav {
          font-family: 'Montserrat', sans-serif;
      }
      
      .nav-item {
        margin-right: 20px;
        margin-top: 15px;
      }

      .nav-link {
          color: black !important;
          font-weight: 500;
          font-size: 1.1rem;
          transition: all 0.3s ease; 
      }
      
      .nav-link:hover {
          color:rgb(0, 0, 0) !important;
          transform: scale(1.05);
      }
     
      .nav-link.active {
        background-color:#EEA988 !important;
      }
      
      :root {
        --header-padding: 20px;
      }
    
      .logo-container {
        margin-left: var(--header-padding);
      }
    
      .nav-menu {
        margin-right: var(--header-padding);
      }

      .header__img {
        height: 27px !important;
        width: 27px !important;
        margin-right: 11px;
        top: -10px;
        margin-top: 1px;
      }

      .header__logo {
        height: 50px;
        width: 150px;
        margin-left: -300px;
      }

      main {
        margin-top: 30px; 
      }
    
      html, body {
        overflow: hidden; 
        height: 100%; 
        margin: 0;
        padding: 0;
    }


      @font-face {
        font-family: 'custom';
        src: url('/static/fonts/custom.ttf') format('truetype');
      }

    </style>
</head>
<div class="container">
  <header class="d-flex flex-wrap justify-content-center py-3 mb-4">
    <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
      <svg class="bi me-2" width="40" height="32" aria-hidden="true"><use xlink:href="#bootstrap"></use></svg>
      <div class="container">
        <img class="header__logo" src="{{ url_for('static', filename='img/7.png') }}" alt="logo">
        </div>
      </a>

      <ul class="nav nav-pills">
        <li class="nav-item"><a href="#" class="nav-link">About Us</a></li>
        <li class="nav-item"><a href="#" class="nav-link">Our Services</a></li>
        <li class="nav-item"><a href="#" class="nav-link">Café Menu</a></li>
        <li class="nav-item"><a href="#" class="nav-link">Expirience</a></li>
        <li class="nav-item">
          <img class="header__img" src="{{ url_for('static', filename='img/6.png') }}" alt="html">
          <li class="nav-item"><a href="#" class="nav-link active" aria-current="page">Contact Us</a></li>
        </li>
      </ul>
    </header>
</div>
</html>

<main>
  <div class="row">
    <div class="col-12">
    </div>
  </div>
</main>
</div>

<footer class="py-3 my-4">
  <ul class="nav justify-content-center border-bottom pb-3 mb-3">
  </ul>
  <p class="text-center text-body-secondary">© 2025 Company, Inc</p>
</footer>
